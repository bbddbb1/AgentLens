name: Question
description: Ask a question about AgentLens
title: "question: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Questions are also welcome as [GitHub Discussions](https://github.com/agentlens/agentlens/discussions). Starting a Discussion may get you a faster response.
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Getting started
        - Configuration
        - SDK usage
        - Ingestion / OTEL
        - HITL / interrupts
        - Graph / replay
        - Deployment
        - Contributing
        - Other
    validations:
      required: true
