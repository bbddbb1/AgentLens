[project]
name = "agentlens-sdk-core"
version = "0.1.0"
description = "Core instrumentation SDK for AgentLens multi-agent observability"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "httpx>=0.28.0",
    "agentlens-otel-semconv",
]

[tool.uv.sources]
agentlens-otel-semconv = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentlens_sdk"]
