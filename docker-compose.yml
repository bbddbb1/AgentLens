version: "3.9"

services:
  # ─── PostgreSQL ───
  postgres:
    image: postgres:16-alpine
    container_name: agentlens-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentlens}
      POSTGRES_DB: ${POSTGRES_DB:-agentlens}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentlens"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ───
  redis:
    image: redis:7-alpine
    container_name: agentlens-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-compatible object storage) ───
  minio:
    image: minio/minio:latest
    container_name: agentlens-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-agentlens}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-agentlens-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── MinIO bucket initialization ───
  minio-init:
    image: minio/mc:latest
    container_name: agentlens-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 agentlens agentlens-secret;
      mc mb local/agentlens-artifacts --ignore-existing;
      mc anonymous set download local/agentlens-artifacts;
      exit 0;
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
